services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      pg1:
        condition: service_healthy
      pg2:
        condition: service_healthy
      pg3:
        condition: service_healthy
    networks:
      - dbnet

  pg1:
    image: postgres:17
    restart: unless-stopped
    healthcheck: &pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U admin -d app"]
      interval: 2s
      timeout: 5s
      retries: 15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
    volumes:
      - pg1_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/db1.crt
      - -c
      - ssl_key_file=/certs/db1.key
    networks:
      - dbnet

  pg2:
    image: postgres:17
    restart: unless-stopped
    healthcheck: *pg-healthcheck
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
    volumes:
      - pg2_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/db2.crt
      - -c
      - ssl_key_file=/certs/db2.key
    networks:
      - dbnet

  pg3:
    image: postgres:17
    restart: unless-stopped
    healthcheck: *pg-healthcheck
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
    volumes:
      - pg3_data:/var/lib/postgresql/data
      - ./certs:/certs:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/db3.crt
      - -c
      - ssl_key_file=/certs/db3.key
    networks:
      - dbnet

volumes:
  pg1_data:
  pg2_data:
  pg3_data:

networks:
  dbnet:
    driver: bridge
