events {}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $ssl_preread_server_name $backend {
        db1.1jz.cc pg1:5432;
        db2.1jz.cc pg2:5432;
        db3.1jz.cc pg3:5432;
        default    pg1:5432;
    }

    server {
        listen 5432;
        ssl_preread on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
